<DOCTYPE html>
<html>
<head>
<title>My Form</title>
</head>
<body>
<h3>Registration Form</h3>
<form>
<label for="id">User ID: </label>
<input type="number" required minlength="5" maxlength="12"><br><br>
<label for="password">Password: </label>
<input type="password" required minlength="7" maxlength="12"><br><br>
<label for="Name">Name</label>
<input type="text" required placeholder="Aayush Rijal"><br><br>
<label for="address">Address</label>
<input type="text" placeholder="Optional" minlength="7" maxlength="14"><br><br>
<label for="country">Country: </label>
<select name="country" required>
<option>Select Country</option>
<option>Nepal</option>
<option>India</option>
<option>China</option>
<option>Russia</option>
<option>United States of America</option>
<option>Others</option>
</select><br><br>
<label for="code">ZIP Code</label>
<input type="number" required><br><br>
<label for="email">Email:</label>
<input type="email" required><br><br>
<label for="sex">Sex: </label>
<input type="radio">Male
<input type="radio">Female
<input type="radio">Others<br><br>
<label for="language">Language: </label>
<input type="checkbox">English
<input type="checkbox">Non-English<br><br>
<label for="about">About: </label><br>
<textarea rows="5" cols="50" placeholder="Optional"></textarea><br><br>
<button type="submit">Submit</button>
</form>
</body>
</html>
